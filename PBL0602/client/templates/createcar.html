{% include 'header.html' %}
<body>
  <div class="top-accent"></div>
  <div class="container mt-5 mb-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card-elegant">
          <div class="card-header text-white py-3 px-4" style="background: linear-gradient(135deg, #4f46e5, #0ea5e9); border: none;">
            <h5 class="mb-0 font-weight-bold">Add Data</h5>
          </div>
          <div class="card-body p-4 bg-white">
            <form role="form" action="{{ url_for('createcarsave') }}" method="POST">
              <div class="form-group">
                <label class="font-weight-bold text-secondary small text-uppercase">Car Name</label>
                <input type="text" class="form-control form-control-elegant" name="carName" placeholder="Contoh: Porsche 911 GT3" required>
              </div>
              <div class="form-group">
                <label class="font-weight-bold text-secondary small text-uppercase">Brand</label>
                <input type="text" class="form-control form-control-elegant" name="carBrand" placeholder="Contoh: Porsche" required>
              </div>
              <div class="form-group">
                <label class="font-weight-bold text-secondary small text-uppercase">Model</label>
                <input type="text" class="form-control form-control-elegant" name="carModel" placeholder="Contoh: Coupe" required>
              </div>
              <div class="form-group">
                <label class="font-weight-bold text-secondary small text-uppercase">Price (USD)</label>
                <input type="text" class="form-control form-control-elegant" name="carPrice" placeholder="Contoh: 185000" required>
              </div>

              <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                <a href="{{ url_for('readcar') }}" class="btn btn-outline-secondary px-4" style="border-radius: 8px;">
                  &larr; Kembali
                </a>
                <button type="submit" class="btn btn-create px-5">
                  Simpan Data
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
{% include 'footer.html' %}
