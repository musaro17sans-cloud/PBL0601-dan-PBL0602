{% include 'header.html' %}
<body>
  <div class="top-accent"></div>
  <div class="container mt-5 mb-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card-elegant">
          <div class="card-header text-white py-3 px-4" style="background: linear-gradient(135deg, #d97706, #f59e0b); border: none;">
            <h5 class="mb-0 font-weight-bold">Update Car Data</h5>
          </div>
          <div class="card-body p-4 bg-white">
            <form role="form" action="{{ url_for('updatecarsave') }}" method="POST">
              <input type="hidden" name="id" value="{{ car.id }}">

              <div class="form-group">
                <label class="font-weight-bold text-secondary small text-uppercase">Car Name</label>
                <input type="text" class="form-control form-control-elegant" name="carName" value="{{ car.carname }}" required>
              </div>
              <div class="form-group">
                <label class="font-weight-bold text-secondary small text-uppercase">Brand</label>
                <input type="text" class="form-control form-control-elegant" name="carBrand" value="{{ car.carbrand }}" required>
              </div>
              <div class="form-group">
                <label class="font-weight-bold text-secondary small text-uppercase">Model</label>
                <input type="text" class="form-control form-control-elegant" name="carModel" value="{{ car.carmodel }}" required>
              </div>
              <div class="form-group">
                <label class="font-weight-bold text-secondary small text-uppercase">Price (USD)</label>
                <input type="text" class="form-control form-control-elegant" name="carPrice" value="{{ car.carprice }}" required>
              </div>

              <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                <a href="{{ url_for('readcar') }}" class="btn btn-outline-secondary px-4" style="border-radius: 8px;">
                  &larr; Kembali
                </a>
                <button type="submit" class="btn text-white px-5 font-weight-bold" style="border-radius: 8px; background: linear-gradient(135deg, #d97706, #f59e0b); border: none; box-shadow: 0 4px 12px rgba(217, 119, 6, 0.25);">
                  Update Data
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
{% include 'footer.html' %}
